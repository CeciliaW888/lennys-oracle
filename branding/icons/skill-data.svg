  <!-- Pupil with chart inside -->
  <circle cx="24" cy="24" r="4" fill="#ffd700" opacity="0.3"/>
  <!-- Mini bar chart in pupil -->
  <rect x="21" y="24" width="2" height="4" fill="#ffd700"/>
  <rect x="23.5" y="22" width="2" height="6" fill="#ffec80"/>
  <rect x="26" y="23" width="2" height="5" fill="#ffd700"/>
