<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#ffec80"/>
    </linearGradient>
  </defs>
  <!-- Eye with data iris — Data/Analytics -->
  <path d="M6 24 C6 24 14 12 24 12 C34 12 42 24 42 24 C42 24 34 36 24 36 C14 36 6 24 6 24 Z" 
    stroke="url(#gold)" stroke-width="2" fill="none"/>
  <!-- Iris -->
