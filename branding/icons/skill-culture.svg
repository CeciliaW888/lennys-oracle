<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#ffec80"/>
    </linearGradient>
  </defs>
  <!-- Connected people — Culture -->
  <!-- Center person -->
  <circle cx="24" cy="14" r="4" stroke="url(#gold)" stroke-width="1.5" fill="none"/>
  <path d="M18 28 Q18 22 24 22 Q30 22 30 28" stroke="url(#gold)" stroke-width="1.5" fill="none"/>
  <!-- Left person -->
  <circle cx="12" cy="22" r="3" stroke="#ffd700" stroke-width="1.5" fill="none" opacity="0.7"/>
  <path d="M8 33 Q8 28 12 28 Q16 28 16 33" stroke="#ffd700" stroke-width="1.5" fill="none" opacity="0.7"/>
  <!-- Right person -->
  <circle cx="36" cy="22" r="3" stroke="#ffd700" stroke-width="1.5" fill="none" opacity="0.7"/>
  <path d="M32 33 Q32 28 36 28 Q40 28 40 33" stroke="#ffd700" stroke-width="1.5" fill="none" opacity="0.7"/>
  <!-- Connection lines (constellation style) -->
  <line x1="18" y1="16" x2="14" y2="20" stroke="#ffd700" stroke-width="0.8" opacity="0.4" stroke-dasharray="2 2"/>
  <line x1="30" y1="16" x2="34" y2="20" stroke="#ffd700" stroke-width="0.8" opacity="0.4" stroke-dasharray="2 2"/>
  <line x1="16" y1="26" x2="32" y2="26" stroke="#ffd700" stroke-width="0.8" opacity="0.3" stroke-dasharray="2 2"/>
  <!-- Heart in center -->
  <path d="M22 36 C22 34 20 34 20 35.5 C20 37 22 38.5 24 40 C26 38.5 28 37 28 35.5 C28 34 26 34 26 36 L24 38 Z" 
    fill="#ffd700" opacity="0.6"/>
</svg>