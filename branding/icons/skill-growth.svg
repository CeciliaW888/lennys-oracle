<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#ffec80"/>
    </linearGradient>
  </defs>
  <!-- Upward arrow with sparkle trail — Growth -->
  <path d="M24 40 L24 12" stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M16 20 L24 12 L32 20" stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Growth chart bars -->
  <rect x="10" y="34" width="4" height="6" rx="1" fill="#ffd700" opacity="0.4"/>
  <rect x="17" y="30" width="4" height="10" rx="1" fill="#ffd700" opacity="0.5"/>
  <rect x="27" y="26" width="4" height="14" rx="1" fill="#ffd700" opacity="0.6"/>
  <rect x="34" y="22" width="4" height="18" rx="1" fill="#ffd700" opacity="0.7"/>
  <!-- Sparkle -->
  <circle cx="24" cy="8" r="2" fill="#ffec80"/>
  <line x1="24" y1="4" x2="24" y2="6" stroke="#ffec80" stroke-width="1"/>
  <line x1="20" y1="8" x2="22" y2="8" stroke="#ffec80" stroke-width="1"/>
  <line x1="26" y1="8" x2="28" y2="8" stroke="#ffec80" stroke-width="1"/>
