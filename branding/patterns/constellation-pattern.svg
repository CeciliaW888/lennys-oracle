<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#ffec80"/>
    </linearGradient>
    <pattern id="constellationTile" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
      <!-- Constellation cluster 1 -->
      <circle cx="30" cy="25" r="2" fill="#ffd700" opacity="0.6"/>
      <circle cx="60" cy="40" r="1.5" fill="#ffd700" opacity="0.5"/>
      <circle cx="45" cy="60" r="2.5" fill="#ffec80" opacity="0.7"/>
      <circle cx="80" cy="30" r="1.8" fill="#ffd700" opacity="0.4"/>
      <circle cx="70" cy="65" r="1.2" fill="#ffd700" opacity="0.5"/>
      <line x1="30" y1="25" x2="60" y2="40" stroke="#ffd700" stroke-width="0.4" opacity="0.3"/>
      <line x1="60" y1="40" x2="45" y2="60" stroke="#ffd700" stroke-width="0.4" opacity="0.3"/>
      <line x1="60" y1="40" x2="80" y2="30" stroke="#ffd700" stroke-width="0.4" opacity="0.3"/>
      <line x1="45" y1="60" x2="70" y2="65" stroke="#ffd700" stroke-width="0.4" opacity="0.3"/>
      
      <!-- Constellation cluster 2 -->
      <circle cx="140" cy="80" r="2" fill="#ffd700" opacity="0.5"/>
      <circle cx="160" cy="100" r="1.8" fill="#ffec80" opacity="0.6"/>
      <circle cx="180" cy="85" r="1.5" fill="#ffd700" opacity="0.4"/>
      <circle cx="155" cy="120" r="2" fill="#ffd700" opacity="0.5"/>
      <line x1="140" y1="80" x2="160" y2="100" stroke="#ffd700" stroke-width="0.4" opacity="0.3"/>
      <line x1="160" y1="100" x2="180" y2="85" stroke="#ffd700" stroke-width="0.4" opacity="0.3"/>
      <line x1="160" y1="100" x2="155" y2="120" stroke="#ffd700" stroke-width="0.4" opacity="0.3"/>
      
      <!-- Constellation cluster 3 -->
      <circle cx="100" cy="150" r="2.5" fill="#ffec80" opacity="0.6"/>
      <circle cx="120" cy="140" r="1.5" fill="#ffd700" opacity="0.5"/>
      <circle cx="85" cy="170" r="1.8" fill="#ffd700" opacity="0.4"/>
      <circle cx="115" cy="175" r="2" fill="#ffd700" opacity="0.5"/>
      <circle cx="130" cy="165" r="1.2" fill="#ffd700" opacity="0.3"/>
      <line x1="100" y1="150" x2="120" y2="140" stroke="#ffd700" stroke-width="0.4" opacity="0.3"/>
      <line x1="100" y1="150" x2="85" y2="170" stroke="#ffd700" stroke-width="0.4" opacity="0.3"/>
      <line x1="100" y1="150" x2="115" y2="175" stroke="#ffd700" stroke-width="0.4" opacity="0.3"/>
      <line x1="115" y1="175" x2="130" y2="165" stroke="#ffd700" stroke-width="0.4" opacity="0.3"/>
      
      <!-- Scattered dust -->
      <circle cx="20" cy="100" r="0.5" fill="#ffffff" opacity="0.15"/>
      <circle cx="170" cy="50" r="0.4" fill="#ffffff" opacity="0.12"/>
      <circle cx="50" cy="130" r="0.6" fill="#ffffff" opacity="0.1"/>
      <circle cx="190" cy="140" r="0.5" fill="#ffffff" opacity="0.15"/>
      <circle cx="35" cy="180" r="0.4" fill="#ffffff" opacity="0.1"/>
      <circle cx="175" cy="185" r="0.3" fill="#ffffff" opacity="0.12"/>
    </pattern>
  </defs>
  
  <!-- Tileable constellation pattern -->
  <rect width="400" height="400" fill="url(#constellationTile)"/>
</svg>