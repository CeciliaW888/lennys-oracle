<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" fill="none">
  <defs>
    <linearGradient id="cosmicBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#1a1640"/>
      <stop offset="100%" stop-color="#302b63"/>
    </linearGradient>
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#ffec80"/>
      <stop offset="100%" stop-color="#ffd700"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0f0c29" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="stars" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="0.5" fill="#ffd700" opacity="0.3"/>
      <circle cx="25" cy="15" r="0.3" fill="#ffffff" opacity="0.2"/>
      <circle cx="45" cy="8" r="0.4" fill="#ffd700" opacity="0.25"/>
      <circle cx="15" cy="35" r="0.3" fill="#ffffff" opacity="0.15"/>
      <circle cx="35" cy="42" r="0.5" fill="#ffd700" opacity="0.2"/>
      <circle cx="55" cy="30" r="0.3" fill="#ffffff" opacity="0.2"/>
      <circle cx="10" cy="55" r="0.4" fill="#ffd700" opacity="0.3"/>
      <circle cx="50" cy="52" r="0.3" fill="#ffffff" opacity="0.15"/>
    </pattern>
  </defs>
  
  <!-- Card background -->
  <rect width="300" height="450" rx="12" fill="url(#cosmicBg)"/>
  
  <!-- Star field -->
  <rect width="300" height="450" rx="12" fill="url(#stars)"/>
  
  <!-- Center glow -->
  <rect width="300" height="450" rx="12" fill="url(#centerGlow)"/>
  
  <!-- Gold border (double line) -->
  <rect x="8" y="8" width="284" height="434" rx="8" stroke="url(#goldShine)" stroke-width="1.5" fill="none" opacity="0.6"/>
  <rect x="16" y="16" width="268" height="418" rx="6" stroke="url(#goldShine)" stroke-width="0.5" fill="none" opacity="0.3"/>
  
  <!-- Corner ornaments -->
  <!-- Top-left -->
  <path d="M24 24 L24 44 M24 24 L44 24" stroke="url(#goldShine)" stroke-width="1" opacity="0.5"/>
  <circle cx="24" cy="24" r="2" fill="#ffd700" opacity="0.5"/>
  <!-- Top-right -->
  <path d="M276 24 L276 44 M276 24 L256 24" stroke="url(#goldShine)" stroke-width="1" opacity="0.5"/>
  <circle cx="276" cy="24" r="2" fill="#ffd700" opacity="0.5"/>
  <!-- Bottom-left -->
  <path d="M24 426 L24 406 M24 426 L44 426" stroke="url(#goldShine)" stroke-width="1" opacity="0.5"/>
  <circle cx="24" cy="426" r="2" fill="#ffd700" opacity="0.5"/>
  <!-- Bottom-right -->
  <path d="M276 426 L276 406 M276 426 L256 426" stroke="url(#goldShine)" stroke-width="1" opacity="0.5"/>
  <circle cx="276" cy="426" r="2" fill="#ffd700" opacity="0.5"/>
  
  <!-- Sacred geometry - outer circle -->
  <circle cx="150" cy="225" r="100" stroke="url(#goldShine)" stroke-width="0.5" fill="none" opacity="0.15"/>
  <circle cx="150" cy="225" r="80" stroke="url(#goldShine)" stroke-width="0.5" fill="none" opacity="0.12"/>
  
  <!-- Central crystal ball -->
  <circle cx="150" cy="225" r="55" stroke="url(#goldShine)" stroke-width="1.5" fill="none" opacity="0.4" filter="url(#glow)"/>
  <circle cx="150" cy="225" r="48" fill="url(#cosmicBg)" stroke="url(#goldShine)" stroke-width="0.8" opacity="0.6"/>
  
  <!-- Constellation inside central orb -->
  <circle cx="130" cy="210" r="3" fill="#ffd700" opacity="0.7" filter="url(#glow)"/>
  <circle cx="155" cy="200" r="2.5" fill="#ffd700" opacity="0.6" filter="url(#glow)"/>
  <circle cx="170" cy="220" r="3" fill="#ffd700" opacity="0.7" filter="url(#glow)"/>
  <circle cx="150" cy="240" r="2.8" fill="#ffd700" opacity="0.6" filter="url(#glow)"/>
  <circle cx="135" cy="245" r="2" fill="#ffd700" opacity="0.5" filter="url(#glow)"/>
  <circle cx="145" cy="218" r="3.5" fill="#ffec80" opacity="0.8" filter="url(#glow)"/>
  
  <line x1="130" y1="210" x2="155" y2="200" stroke="#ffd700" stroke-width="0.6" opacity="0.4"/>
  <line x1="155" y1="200" x2="170" y2="220" stroke="#ffd700" stroke-width="0.6" opacity="0.4"/>
  <line x1="170" y1="220" x2="150" y2="240" stroke="#ffd700" stroke-width="0.6" opacity="0.4"/>
  <line x1="150" y1="240" x2="135" y2="245" stroke="#ffd700" stroke-width="0.6" opacity="0.4"/>
  <line x1="145" y1="218" x2="130" y2="210" stroke="#ffd700" stroke-width="0.6" opacity="0.4"/>
  <line x1="145" y1="218" x2="155" y2="200" stroke="#ffd700" stroke-width="0.6" opacity="0.4"/>
  <line x1="145" y1="218" x2="150" y2="240" stroke="#ffd700" stroke-width="0.6" opacity="0.4"/>
  
  <!-- Crystal ball base -->
  <path d="M130 275 Q150 268 170 275 L165 282 Q150 278 135 282 Z" fill="url(#goldShine)" opacity="0.3"/>
  
  <!-- Radiating lines from center -->
  <line x1="150" y1="120" x2="150" y2="160" stroke="url(#goldShine)" stroke-width="0.3" opacity="0.2"/>
  <line x1="150" y1="290" x2="150" y2="330" stroke="url(#goldShine)" stroke-width="0.3" opacity="0.2"/>
  <line x1="55" y1="225" x2="90" y2="225" stroke="url(#goldShine)" stroke-width="0.3" opacity="0.2"/>
  <line x1="210" y1="225" x2="245" y2="225" stroke="url(#goldShine)" stroke-width="0.3" opacity="0.2"/>
  
  <!-- Diagonal lines -->
  <line x1="80" y1="155" x2="105" y2="180" stroke="url(#goldShine)" stroke-width="0.3" opacity="0.15"/>
  <line x1="220" y1="155" x2="195" y2="180" stroke="url(#goldShine)" stroke-width="0.3" opacity="0.15"/>
  <line x1="80" y1="295" x2="105" y2="270" stroke="url(#goldShine)" stroke-width="0.3" opacity="0.15"/>
  <line x1="220" y1="295" x2="195" y2="270" stroke="url(#goldShine)" stroke-width="0.3" opacity="0.15"/>
  
  <!-- Outer constellation points -->
  <circle cx="80" cy="150" r="2" fill="#ffd700" opacity="0.3"/>
  <circle cx="220" cy="150" r="2" fill="#ffd700" opacity="0.3"/>
  <circle cx="80" cy="300" r="2" fill="#ffd700" opacity="0.3"/>
  <circle cx="220" cy="300" r="2" fill="#ffd700" opacity="0.3"/>
  <circle cx="50" cy="225" r="1.5" fill="#ffd700" opacity="0.25"/>
  <circle cx="250" cy="225" r="1.5" fill="#ffd700" opacity="0.25"/>
  <circle cx="150" cy="115" r="1.5" fill="#ffd700" opacity="0.25"/>
  <circle cx="150" cy="335" r="1.5" fill="#ffd700" opacity="0.25"/>
  
  <!-- Top text area -->
  <text x="150" y="80" text-anchor="middle" font-family="'Cinzel', serif" font-size="10" letter-spacing="6" fill="#ffd700" opacity="0.4">LENNY'S</text>
  
  <!-- Bottom text area -->
  <text x="150" y="395" text-anchor="middle" font-family="'Cinzel', serif" font-size="10" letter-spacing="6" fill="#ffd700" opacity="0.4">ORACLE</text>
  
  <!-- Small decorative dots scattered -->
  <circle cx="40" cy="60" r="0.8" fill="#ffd700" opacity="0.2"/>
  <circle cx="260" cy="70" r="0.6" fill="#ffffff" opacity="0.15"/>
  <circle cx="70" cy="380" r="0.7" fill="#ffd700" opacity="0.2"/>
  <circle cx="230" cy="390" r="0.5" fill="#ffffff" opacity="0.15"/>
  <circle cx="45" cy="180" r="0.6" fill="#ffd700" opacity="0.2"/>
  <circle cx="255" cy="270" r="0.7" fill="#ffffff" opacity="0.15"/>
</svg>