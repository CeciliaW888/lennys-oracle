<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 60" fill="none">
  <defs>
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#ffec80"/>
      <stop offset="100%" stop-color="#ffd700"/>
    </linearGradient>
    <linearGradient id="orbGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#302b63" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f0c29" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Small crystal ball icon -->
  <g transform="translate(5, 5)">
    <circle cx="25" cy="25" r="23" stroke="url(#goldShine)" stroke-width="1.5" fill="none" filter="url(#glow)"/>
    <circle cx="25" cy="25" r="19" fill="url(#orbGlow)" stroke="url(#goldShine)" stroke-width="0.8"/>
    
    <!-- Mini constellation -->
    <circle cx="18" cy="18" r="1.5" fill="#ffd700" filter="url(#glow)"/>
    <circle cx="28" cy="16" r="1.2" fill="#ffd700" filter="url(#glow)"/>
    <circle cx="33" cy="24" r="1.5" fill="#ffd700" filter="url(#glow)"/>
    <circle cx="25" cy="30" r="1.3" fill="#ffd700" filter="url(#glow)"/>
    <circle cx="19" cy="32" r="1.1" fill="#ffd700" filter="url(#glow)"/>
    <circle cx="23" cy="22" r="1.8" fill="#ffec80" filter="url(#glow)"/>
    
    <line x1="18" y1="18" x2="28" y2="16" stroke="#ffd700" stroke-width="0.4" opacity="0.5"/>
    <line x1="28" y1="16" x2="33" y2="24" stroke="#ffd700" stroke-width="0.4" opacity="0.5"/>
    <line x1="33" y1="24" x2="25" y2="30" stroke="#ffd700" stroke-width="0.4" opacity="0.5"/>
    <line x1="23" y1="22" x2="18" y2="18" stroke="#ffd700" stroke-width="0.4" opacity="0.5"/>
    <line x1="23" y1="22" x2="28" y2="16" stroke="#ffd700" stroke-width="0.4" opacity="0.5"/>
    <line x1="23" y1="22" x2="25" y2="30" stroke="#ffd700" stroke-width="0.4" opacity="0.5"/>
    
    <!-- Base -->
    <path d="M18 45 Q25 42 32 45 L30 48 Q25 46 20 48 Z" fill="url(#goldShine)" opacity="0.7"/>
  </g>
  
  <!-- Horizontal wordmark -->
  <text x="70" y="30" font-family="'Cinzel', 'Times New Roman', serif" font-size="18" font-weight="700" letter-spacing="4" fill="url(#goldShine)" filter="url(#glow)">LENNY'S</text>
  <text x="200" y="30" font-family="'Cinzel', 'Times New Roman', serif" font-size="18" font-weight="400" letter-spacing="8" fill="#f5f0eb">ORACLE</text>
  
  <!-- Separator dots -->
  <circle cx="192" cy="26" r="1.5" fill="#ffd700" opacity="0.5"/>
  
  <!-- Tagline -->
  <text x="70" y="48" font-family="'Inter', 'Helvetica', sans-serif" font-size="8" letter-spacing="3" fill="#ffd700" opacity="0.6">PRODUCT WISDOM AWAITS</text>
</svg>