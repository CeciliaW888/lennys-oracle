<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="100%" stop-color="#302b63"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#ffec80"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="url(#bg)"/>
  
  <!-- Crystal ball outline -->
  <circle cx="16" cy="14" r="10" stroke="url(#gold)" stroke-width="1.2" fill="none"/>
  
  <!-- Constellation dots -->
  <circle cx="12" cy="11" r="1.3" fill="#ffd700"/>
  <circle cx="18" cy="10" r="1" fill="#ffd700"/>
  <circle cx="20" cy="15" r="1.2" fill="#ffd700"/>
  <circle cx="15" cy="17" r="1.1" fill="#ffd700"/>
  <circle cx="14" cy="13" r="1.5" fill="#ffec80"/>
  
  <!-- Lines -->
  <line x1="12" y1="11" x2="18" y2="10" stroke="#ffd700" stroke-width="0.5" opacity="0.6"/>
  <line x1="18" y1="10" x2="20" y2="15" stroke="#ffd700" stroke-width="0.5" opacity="0.6"/>
  <line x1="14" y1="13" x2="12" y2="11" stroke="#ffd700" stroke-width="0.5" opacity="0.6"/>
  <line x1="14" y1="13" x2="15" y2="17" stroke="#ffd700" stroke-width="0.5" opacity="0.6"/>
  
  <!-- Base -->
  <path d="M12 26 Q16 24 20 26 L19 28 Q16 27 13 28 Z" fill="url(#gold)" opacity="0.8"/>
