<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none">
  <defs>
    <linearGradient id="deepPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="100%" stop-color="#302b63"/>
    </linearGradient>
    <linearGradient id="goldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8860b"/>
      <stop offset="50%" stop-color="#daa520"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <linearGradient id="orbLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8e4f0"/>
      <stop offset="100%" stop-color="#d4cfe8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- For light backgrounds -->
  <g transform="translate(10, 10)">
    <circle cx="50" cy="50" r="45" stroke="url(#deepPurple)" stroke-width="2" fill="none"/>
    <circle cx="50" cy="50" r="38" fill="url(#orbLight)" stroke="url(#deepPurple)" stroke-width="1.5"/>
    <circle cx="35" cy="35" r="2" fill="#302b63"/>
    <circle cx="55" cy="30" r="1.5" fill="#302b63"/>
    <circle cx="65" cy="45" r="2" fill="#302b63"/>
    <circle cx="50" cy="55" r="1.8" fill="#302b63"/>
    <circle cx="38" cy="60" r="1.5" fill="#302b63"/>
    <circle cx="45" cy="42" r="2.5" fill="#0f0c29"/>
    <line x1="35" y1="35" x2="55" y2="30" stroke="#302b63" stroke-width="0.7" opacity="0.5"/>
    <line x1="55" y1="30" x2="65" y2="45" stroke="#302b63" stroke-width="0.7" opacity="0.5"/>
    <line x1="65" y1="45" x2="50" y2="55" stroke="#302b63" stroke-width="0.7" opacity="0.5"/>
    <line x1="45" y1="42" x2="35" y2="35" stroke="#302b63" stroke-width="0.7" opacity="0.5"/>
    <line x1="45" y1="42" x2="55" y2="30" stroke="#302b63" stroke-width="0.7" opacity="0.5"/>
    <line x1="45" y1="42" x2="50" y2="55" stroke="#302b63" stroke-width="0.7" opacity="0.5"/>
    <path d="M35 90 Q50 85 65 90 L60 95 Q50 92 40 95 Z" fill="url(#deepPurple)" opacity="0.8"/>
  </g>
  
  <g transform="translate(120, 0)">
    <text x="0" y="48" font-family="'Cinzel', 'Times New Roman', serif" font-size="24" font-weight="700" letter-spacing="6" fill="url(#goldDark)">LENNY'S</text>
    <text x="0" y="88" font-family="'Cinzel', 'Times New Roman', serif" font-size="38" font-weight="400" letter-spacing="12" fill="#0f0c29">ORACLE</text>
    <line x1="0" y1="55" x2="260" y2="55" stroke="url(#deepPurple)" stroke-width="0.5" opacity="0.3"/>
    <text x="0" y="108" font-family="'Inter', 'Helvetica', sans-serif" font-size="10" letter-spacing="4" fill="#302b63" opacity="0.7">PRODUCT WISDOM AWAITS</text>
  </g>
</svg>