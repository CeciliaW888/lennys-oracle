<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none">
  <defs>
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#ffec80"/>
      <stop offset="100%" stop-color="#ffd700"/>
    </linearGradient>
    <linearGradient id="orbGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#302b63" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f0c29" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- For dark backgrounds -->
  <g transform="translate(10, 10)">
    <circle cx="50" cy="50" r="45" stroke="url(#goldShine)" stroke-width="2" fill="none" filter="url(#glow)"/>
    <circle cx="50" cy="50" r="38" fill="url(#orbGlow)" stroke="url(#goldShine)" stroke-width="1" opacity="0.9"/>
    <circle cx="35" cy="35" r="2" fill="#ffd700" filter="url(#glow)"/>
    <circle cx="55" cy="30" r="1.5" fill="#ffd700" filter="url(#glow)"/>
    <circle cx="65" cy="45" r="2" fill="#ffd700" filter="url(#glow)"/>
    <circle cx="50" cy="55" r="1.8" fill="#ffd700" filter="url(#glow)"/>
    <circle cx="38" cy="60" r="1.5" fill="#ffd700" filter="url(#glow)"/>
    <circle cx="45" cy="42" r="2.5" fill="#ffec80" filter="url(#glow)"/>
    <line x1="35" y1="35" x2="55" y2="30" stroke="#ffd700" stroke-width="0.5" opacity="0.6"/>
    <line x1="55" y1="30" x2="65" y2="45" stroke="#ffd700" stroke-width="0.5" opacity="0.6"/>
    <line x1="65" y1="45" x2="50" y2="55" stroke="#ffd700" stroke-width="0.5" opacity="0.6"/>
    <line x1="45" y1="42" x2="35" y2="35" stroke="#ffd700" stroke-width="0.5" opacity="0.6"/>
    <line x1="45" y1="42" x2="55" y2="30" stroke="#ffd700" stroke-width="0.5" opacity="0.6"/>
    <line x1="45" y1="42" x2="50" y2="55" stroke="#ffd700" stroke-width="0.5" opacity="0.6"/>
    <path d="M35 90 Q50 85 65 90 L60 95 Q50 92 40 95 Z" fill="url(#goldShine)" opacity="0.8"/>
  </g>
  
  <g transform="translate(120, 0)">
    <text x="0" y="48" font-family="'Cinzel', 'Times New Roman', serif" font-size="24" font-weight="700" letter-spacing="6" fill="url(#goldShine)" filter="url(#glow)">LENNY'S</text>
    <text x="0" y="88" font-family="'Cinzel', 'Times New Roman', serif" font-size="38" font-weight="400" letter-spacing="12" fill="#ffffff">ORACLE</text>
    <line x1="0" y1="55" x2="260" y2="55" stroke="url(#goldShine)" stroke-width="0.5" opacity="0.4"/>
    <text x="0" y="108" font-family="'Inter', 'Helvetica', sans-serif" font-size="10" letter-spacing="4" fill="#ffd700" opacity="0.7">PRODUCT WISDOM AWAITS</text>
  </g>
</svg>