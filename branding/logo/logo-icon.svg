<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#ffec80"/>
      <stop offset="100%" stop-color="#ffd700"/>
    </linearGradient>
    <linearGradient id="orbGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#302b63" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f0c29" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0f0c29" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer ring -->
  <circle cx="50" cy="50" r="46" stroke="url(#goldShine)" stroke-width="2" fill="none" filter="url(#glow)"/>
  
  <!-- Inner orb -->
  <circle cx="50" cy="50" r="39" fill="url(#orbGlow)" stroke="url(#goldShine)" stroke-width="1"/>
  
  <!-- Center glow -->
  <circle cx="50" cy="50" r="39" fill="url(#centerGlow)"/>
  
  <!-- Constellation -->
  <circle cx="35" cy="35" r="2.5" fill="#ffd700" filter="url(#glow)"/>
  <circle cx="55" cy="30" r="2" fill="#ffd700" filter="url(#glow)"/>
  <circle cx="67" cy="45" r="2.5" fill="#ffd700" filter="url(#glow)"/>
  <circle cx="50" cy="55" r="2.2" fill="#ffd700" filter="url(#glow)"/>
  <circle cx="36" cy="62" r="2" fill="#ffd700" filter="url(#glow)"/>
  <circle cx="62" cy="67" r="1.5" fill="#ffd700" filter="url(#glow)"/>
  <circle cx="45" cy="42" r="3" fill="#ffec80" filter="url(#glow)"/>
  
  <!-- Constellation lines -->
  <line x1="35" y1="35" x2="55" y2="30" stroke="#ffd700" stroke-width="0.7" opacity="0.5"/>
  <line x1="55" y1="30" x2="67" y2="45" stroke="#ffd700" stroke-width="0.7" opacity="0.5"/>
  <line x1="67" y1="45" x2="50" y2="55" stroke="#ffd700" stroke-width="0.7" opacity="0.5"/>
  <line x1="50" y1="55" x2="36" y2="62" stroke="#ffd700" stroke-width="0.7" opacity="0.5"/>
  <line x1="50" y1="55" x2="62" y2="67" stroke="#ffd700" stroke-width="0.7" opacity="0.5"/>
  <line x1="45" y1="42" x2="35" y2="35" stroke="#ffd700" stroke-width="0.7" opacity="0.5"/>
  <line x1="45" y1="42" x2="55" y2="30" stroke="#ffd700" stroke-width="0.7" opacity="0.5"/>
  <line x1="45" y1="42" x2="50" y2="55" stroke="#ffd700" stroke-width="0.7" opacity="0.5"/>
  
  <!-- Sparkles -->
  <circle cx="30" cy="48" r="1" fill="#ffffff" opacity="0.6"/>
  <circle cx="63" cy="37" r="0.8" fill="#ffffff" opacity="0.5"/>
  <circle cx="42" cy="70" r="0.9" fill="#ffffff" opacity="0.5"/>
  <circle cx="58" cy="60" r="0.7" fill="#ffffff" opacity="0.4"/>
  <circle cx="72" cy="55" r="0.6" fill="#ffffff" opacity="0.3"/>
  
  <!-- Base -->
  <path d="M36 88 Q50 84 64 88 L60 93 Q50 90 40 93 Z" fill="url(#goldShine)" opacity="0.7"/>
</svg>